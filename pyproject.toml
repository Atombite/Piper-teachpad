[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-control"
version = "0.1.0"
description = "Control service for AgileX Piper robotic arms"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "piper_sdk>=0.6,<0.7",
    "pyserial>=3.5,<4",
    "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "websockets>=13,<17",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
]
mujoco = [
    "mujoco>=3.3,<4",
]
dataset = [
    "pyarrow>=14,<26",
    "websockets>=13,<17",
]
camera = [
    "pyzmq>=26,<28",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pyrealsense2>=2.55,<3",
]

[project.scripts]
piper-control = "piper_control.main:main"
piper-control-bridge = "piper_control.bridge.main:main"
piper-control-can = "piper_control.can_cli:main"
piper-calibrate = "piper_control.calibration_cli:main"
camera-bridge = "piper_control.camera_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piper_control = [
    "web/*.html",
    "web/*.js",
    "web/*.css",
    "web/vendor/*",
    "web/models/piper/*",
    "web/models/piper/meshes/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mujoco_acceptance: opt-in real MuJoCo and Chrome browser acceptance",
]
